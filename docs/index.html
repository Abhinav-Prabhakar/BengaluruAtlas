    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var pref = localStorage.getItem('bengaluru-atlas:theme-pref:v1');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
            ? 'dark'
            : 'light';
        }
      })();
    </script>
    <meta name="theme-color" content="#0E100C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3EDE2" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
